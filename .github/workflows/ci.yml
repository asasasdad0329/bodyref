# 每次推送與 PR 都跑測試和建置
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Capture body views and verify ratio interactions
        run: node tools/body-visual.mjs "$RUNNER_TEMP/body-visual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-visual
          path: ${{ runner.temp }}/body-visual
          if-no-files-found: ignore
