# 建置並發佈到 GitHub Pages。
# 只有推送 stable-* 標籤（切換代理時的檢查點，見 AGENTS.md）才會發佈，main 上的每次合併不會直接上線；
# 也可以手動執行（Actions → Deploy to GitHub Pages → Run workflow）。
# 需要先在 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    tags: ['stable-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
