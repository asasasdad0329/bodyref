# 建置並發佈到 GitHub Pages。
# 只有建立 stable-* 標籤（切換代理時的檢查點，由作者在 Releases 頁面建立，見 AGENTS.md）才會發佈，
# main 上的每次合併不會直接上線；也可以手動執行（Actions → Deploy to GitHub Pages → Run workflow）。
# 需要先在 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    tags: ['stable-*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      checkpoint:
        description: '依作者要求發布未驗收工作版；保留測試失敗與網站標示'
        type: boolean
        default: false
      evidence:
        description: '附上本次版本的數值與九視角驗證頁'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Release 只認 stable-* 標籤；同一次發佈同時觸發 push 與 release 時，concurrency 會取消重複的那一次
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'stable-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run regression tests
        id: tests
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/bodyref-tests.log"
      - name: Preserve checkpoint test result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-tests-${{ github.sha }}
          path: ${{ runner.temp }}/bodyref-tests.log
      - name: Mark checkpoint status
        if: always() && github.event_name == 'workflow_dispatch' && inputs.checkpoint
        run: |
          echo '### C1 工作版：未驗收，不是穩定版' >> "$GITHUB_STEP_SUMMARY"
          echo '測試結果：${{ steps.tests.outcome }}。完整結果保存在 checkpoint-tests 產物；CI 與 PR 的通過條件不變。' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          BODYREF_CHECKPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint && '1' || '' }}
      - name: Prepare evidence renderer
        if: github.event_name == 'workflow_dispatch' && inputs.evidence
        run: npx playwright install --with-deps chromium
      - name: Include same-version evidence gallery
        if: github.event_name == 'workflow_dispatch' && inputs.evidence
        run: |
          export BODYREF_CHROMIUM=$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')
          node tools/shape-evidence.mjs "$RUNNER_TEMP/bodyref-views"
          mkdir -p dist/evidence
          cp "$RUNNER_TEMP/bodyref-views/"*.png "$RUNNER_TEMP/bodyref-views/report.json" "$RUNNER_TEMP/bodyref-views/index.html" dist/evidence/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
