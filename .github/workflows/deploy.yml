# 建置並發佈到 GitHub Pages。
# GitHub 免費方案只有公開儲存庫能用 Pages，所以目前只能手動執行（Actions → Deploy to GitHub Pages → Run workflow）。
# 啟用 Pages（Settings → Pages → Source 選「GitHub Actions」）之後，可以把下面的 push 觸發條件取消註解，
# 推送到 main 時就會自動發佈。
name: Deploy to GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
