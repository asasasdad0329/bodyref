# 建置並發佈到 GitHub Pages。
# 只有建立 stable-* 標籤（切換代理時的檢查點，由作者在 Releases 頁面建立，見 AGENTS.md）才會發佈，
# main 上的每次合併不會直接上線；也可以手動執行（Actions → Deploy to GitHub Pages → Run workflow）。
# 需要先在 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    tags: ['stable-*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      evidence:
        description: '附上本次版本的數值與九視角驗證頁'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Release 只認 stable-* 標籤；同一次發佈同時觸發 push 與 release 時，concurrency 會取消重複的那一次
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'stable-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare evidence renderer
        if: github.event_name == 'workflow_dispatch' && inputs.evidence
        run: npx playwright install --with-deps chromium
      - name: Include same-version evidence gallery
        if: github.event_name == 'workflow_dispatch' && inputs.evidence
        run: |
          export BODYREF_CHROMIUM=$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')
          node tools/shape-evidence.mjs "$RUNNER_TEMP/bodyref-views"
          mkdir -p dist/evidence
          cp "$RUNNER_TEMP/bodyref-views/"*.png "$RUNNER_TEMP/bodyref-views/report.json" "$RUNNER_TEMP/bodyref-views/index.html" dist/evidence/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
