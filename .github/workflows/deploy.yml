# GitHub Pages 的轉址頁（DECISIONS #90）：正式站搬到 https://bodyref.oriharastudio.com（Cloudflare Workers，
# 由 Cloudflare 從公開庫 main 自動建置，見公開庫的 wrangler.jsonc）。舊網址 asasasdad0329.github.io/bodyref/ 只留一頁轉址，
# 帶著路徑、分享代碼（?b=…）與 # 後面的部分跳到新網址；找不到的路徑（404.html）也一樣。
# 只在公開庫 bodyref 跑，而且只能手動執行（Actions → Deploy to GitHub Pages → Run workflow），轉址頁改了才要再跑。
# 放一段時間後關掉 Pages（Settings → Pages）。
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'asasasdad0329/bodyref'
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant">
          <head>
          <meta charset="utf-8">
          <title>BodyRef 實尺人台已搬到新網址</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://bodyref.oriharastudio.com/">
          <script>
          var rest = location.pathname.replace(/^\/bodyref(\/|$)/, '');
          location.replace('https://bodyref.oriharastudio.com/' + rest + location.search + location.hash);
          </script>
          <noscript><meta http-equiv="refresh" content="0; url=https://bodyref.oriharastudio.com/"></noscript>
          </head>
          <body>
          <p>BodyRef 實尺人台已搬到 <a href="https://bodyref.oriharastudio.com/">bodyref.oriharastudio.com</a>。</p>
          </body>
          </html>
          EOF
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
