name: Shape evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: BODYREF_SINGLE_HTML="$GITHUB_WORKSPACE/dist/bodyref-single.html" npm run test:ui -- "$RUNNER_TEMP/bodyref-evidence/ui"
      - run: cp dist/bodyref-single.html "$RUNNER_TEMP/bodyref-evidence/"
      - run: npm run test:body-report -- "$RUNNER_TEMP/bodyref-evidence/numeric.json"
      - run: npm run test:shape-report -- "$RUNNER_TEMP/bodyref-evidence/images"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bodyref-shape-evidence
          path: ${{ runner.temp }}/bodyref-evidence
