# 暫存用：試著從 GitHub 的機器下載 ANSUR I（1988）公開資料，做成 Actions 產物（不提交、不合併進 main）
name: Fetch ANSUR I
on:
  push:
    branches: [claude/fetch-ansur]
    paths: ['.github/workflows/fetch-ansur.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for f in ansurWomen.csv ansurMen.csv ANSUR-TR89-044.pdf; do
            for base in http://tools.openlab.psu.edu/publicData https://tools.openlab.psu.edu/publicData; do
              code=$(curl -sSL -A "Mozilla/5.0" -o "$f" -w "%{http_code}" "$base/$f" || true)
              echo "$base/$f -> $code $(stat -c %s "$f" 2>/dev/null)"
              [ "$code" = "200" ] && break
            done
          done
          head -c 400 ansurWomen.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: ansur1
          path: out
          retention-days: 3
