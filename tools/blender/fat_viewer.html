<title>臀・純脂肪線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
  /* 版面：整個畫面就是可旋轉的灰模，自動在瘦 ↔ 胖之間循環；角落一行小字顯示目前的脂肪量與臀圍。 */
  :root {
    --stage: #d9d8d4;       /* 3D 背景 */
    --fg: #22221f;          /* 文字 */
    --muted: #6d6b65;       /* 次要文字 */
    --accent: #c26a1a;      /* 脂肪曲線的橘（和研究圖同色系） */
    --clay: #a8a7a2;        /* 灰模（臀負責的範圍） */
    --belly: #b9c4cf;       /* 下腹：交給腹部 */
    --thigh: #8f8e89;       /* 褲管以下的大腿 */
    --display: "Barlow Condensed", "Noto Sans TC", system-ui, sans-serif;
    --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --stage: #2a2a28; --fg: #ecebe7; --muted: #a3a19a; --accent: #e8913f; --clay: #9a9994; --belly: #8696a6; --thigh: #7c7b77; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --stage: #2a2a28; --fg: #ecebe7; --muted: #a3a19a; --accent: #e8913f; --clay: #9a9994; --belly: #8696a6; --thigh: #7c7b77; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--stage); color: var(--fg); font-family: var(--body); }
  .stage { position: relative; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .label {
    position: absolute; top: 10px; pointer-events: none;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  }
  h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: .02em; }
  .now { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .now b { color: var(--accent); font-weight: 600; }
  .hint, .status {
    position: absolute; bottom: 10px; pointer-events: none; font-size: .75rem; color: var(--muted);
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  }
  .status { bottom: auto; top: 44px; font-size: .9rem; color: var(--fg); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); width: 100%; }
  .legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .toggle {
    position: absolute; bottom: 34px; right: max(16px, env(safe-area-inset-right, 0px));
    font: inherit; font-size: .85rem; color: var(--fg); background: var(--stage);
    border: 1px solid var(--muted); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="stage">
  <canvas id="view" aria-label="可旋轉的臀部灰模，自動在瘦與胖之間循環"></canvas>
  <div class="label">
    <h1>臀・純脂肪線</h1>
    <div class="now" aria-live="off"><span id="val"><span id="axis">全身脂肪</span> <b id="fat">17.0</b> kg・</span>臀圍 <span id="hip">—</span> cm<span id="extra"></span></div>
    <div class="legend"><span><i id="sw0"></i>臀負責（平口褲範圍）</span><span><i id="sw1"></i>下腹（交給腹部）</span><span><i id="sw2"></i>褲管以下的大腿</span></div>
  </div>
  <button class="toggle" id="thighs" type="button" aria-pressed="false">隱藏大腿</button>
  <div class="status" id="status">載入模型中…</div>
  <div class="hint" id="hint">拖曳旋轉・雙指或滾輪縮放</div>
</div>

<script type="application/json" id="meta">/*__META__*/null</script>
<script type="text/plain" id="data">/*__DATA__*/</script>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const meta = JSON.parse(document.getElementById('meta').textContent);
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const Fmin = meta.F[0], Fmax = meta.F[meta.F.length - 1];
const PERIOD = 16;   // 秒：瘦 → 胖 → 瘦一趟
if (meta.title) { document.title = meta.title; document.querySelector('h1').textContent = meta.title; }
if (meta.axis) $('axis').textContent = meta.axis;
if (meta.hide_value) $('val').hidden = true;   // 格點不是公斤（例如骨架線）：只顯示臀圍與說明
$('hint').textContent += meta.hide_value ? '・自動循環' : `・${meta.axis || '全身脂肪'} ${Fmin} → ${Fmax} → ${Fmin} kg 循環`;

const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 1, 1000);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4a48, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-0.55, 0.8, 0.6);   // 跟著相機：永遠從畫面左上方打光
camera.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(0.8, -0.1, 0.4);
camera.add(fill);
// 分區用頂點顏色（DECISIONS #62）；「隱藏大腿」用切平面切在褲管高度
const hem = new THREE.Plane(new THREE.Vector3(0, 1, 0), -meta.hem_y);
const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0, side: THREE.DoubleSide, clippingPlanes: [] });
renderer.localClippingEnabled = true;
$('thighs').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  e.currentTarget.textContent = on ? '顯示大腿' : '隱藏大腿';
  material.clippingPlanes = on ? [hem] : [];
  material.needsUpdate = true;
});
const target = new THREE.Vector3(0, 84, 0);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(target);
controls.enableDamping = true;
controls.minDistance = 45;
controls.maxDistance = 260;

let colors;
function applyTheme() {
  scene.background = new THREE.Color(css('--stage'));
  const pal = ['--clay', '--belly', '--thigh'].map((v) => new THREE.Color(css(v)));
  pal.forEach((c, k) => { $('sw' + k).style.background = '#' + c.getHexString(); });
  if (!colors) return;
  for (let i = 0; i < meta.nv; i++) pal[zone[i]].toArray(colors, i * 3);
  geometry.attributes.color.needsUpdate = true;
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
// 起始視角：斜後方；距離依畫面比例決定，手機直向時胖端（寬約 50 公分）也放得進畫面
function frame() {
  resize();
  const halfW = 34, halfH = 24, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(halfH / t, halfW / (t * camera.aspect));
  camera.position.copy(target).add(new THREE.Vector3(1, 0.12, -1).normalize().multiplyScalar(dist));
  controls.maxDistance = Math.max(260, dist * 1.6);
  controls.update();
}

let frames, positions, geometry, zone;
function locate(F) {
  // 格點可以不等距（組成線）：找 F 落在哪兩組之間
  const G = meta.F, last = G.length - 2;
  let i = 0;
  while (i < last && F > G[i + 1]) i++;
  const u = Math.min(Math.max((F - G[i]) / (G[i + 1] - G[i]), 0), 1);
  return [i, u];
}
function setFat(F) {
  const [i, u] = locate(F);
  const n = meta.nv * 3, a = i * n, b = a + n, s = meta.step, o = meta.origin;
  for (let k = 0; k < n; k++) positions[k] = o[k % 3] + (frames[a + k] * (1 - u) + frames[b + k] * u) * s;
  geometry.attributes.position.needsUpdate = true;
  geometry.computeVertexNormals();
  $('fat').textContent = F.toFixed(1);
  $('hip').textContent = (meta.hip[i] * (1 - u) + meta.hip[i + 1] * u).toFixed(1);
  if (meta.extra) $('extra').textContent = '・' + meta.extra[u < 0.5 ? i : i + 1];   // 每組另外的說明（例如組成線的脂肪量）
}

// 網格資料以 base64 內嵌在頁面裡（文章站不接受另外的二進位檔）
try {
  const bin = atob($('data').textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  frames = new Int16Array(bytes.buffer, 0, meta.F.length * meta.nv * 3);
  const at = Math.ceil(frames.byteLength / 4) * 4;   // 頂點資料後補齊到 4 位元組
  const index = new Uint32Array(bytes.buffer, at, meta.nt * 3);
  positions = new Float32Array(meta.nv * 3);
  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setIndex(new THREE.BufferAttribute(index, 1));
  zone = new Uint8Array(bytes.buffer, at + index.byteLength, meta.nv);
  colors = new Float32Array(meta.nv * 3);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  applyTheme();
  scene.add(new THREE.Mesh(geometry, material));
  $('status').hidden = true;
} catch (e) {
  $('status').textContent = `模型資料讀不到（${e.message}）。重新整理頁面再試一次。`;
}

// 減少動態的設定：停在中性，不循環
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const start = performance.now();
function loop(now) {
  if (frames) {
    const phase = ((now - start) / 1000 / PERIOD) % 1;
    const F = still ? meta.F0 : Fmin + (Fmax - Fmin) * (1 - Math.cos(2 * Math.PI * phase)) / 2;
    setFat(F);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
frame();
requestAnimationFrame(loop);
</script>
